[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regops"
version = "0.1.0"
description = "Compliance as Code — traceability between code, requirements, risks and tests for medical device software"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["medtech", "compliance", "IEC62304", "MDR", "traceability", "regulatory"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
regops = "regops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["regops"]

[tool.hatch.build.targets.wheel.force-include]
"regops/templates" = "regops/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["regops"]
omit = ["tests/*", "fixtures/*"]
