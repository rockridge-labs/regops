# .regops/schema.yaml — generated by `regops init`
# Customize node types, standards, and project metadata for your repo.
# Rules in regops/checker.py operate on `maps_to` (standard concept),
# so you can rename a node type without breaking compliance checks.

node_types:

  user_need:
    label: "User Need"
    abbreviation: "UN"
    maps_to: user_need
    requires_code: false

  regulatory_need:
    label: "Regulatory Need"
    abbreviation: "REG"
    maps_to: user_need
    requires_code: false

  security_need:
    label: "Security Need"
    abbreviation: "SEC"
    maps_to: user_need
    requires_code: false

  architectural_need:
    label: "Architectural Need"
    abbreviation: "ARCH"
    maps_to: user_need
    requires_code: false

  system_requirement:
    label: "System Requirement"
    abbreviation: "SYS"
    maps_to: system_requirement
    requires_code: false

  software_requirement:
    label: "Software Requirement"
    abbreviation: "SR"
    maps_to: software_requirement
    requires_code: true

  software_item:
    label: "Software Item"
    abbreviation: "SI"
    maps_to: software_item
    requires_code: true

  software_unit:
    label: "Software Unit"
    abbreviation: "SU"
    maps_to: software_unit
    requires_code: true

active_standards:
  - {{STANDARD}}

project:
  name: "MyProject"
  version: "0.1.0"
  safety_class: {{SAFETY_CLASS}}
